repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: ruff
        name: Ruff lint
        entry: uv run --locked ruff check --force-exclude
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: Ruff format check
        entry: uv run --locked ruff format --check --force-exclude
        language: system
        types_or: [python, pyi]
      - id: pyright
        name: Pyright
        entry: uv run --locked pyright
        language: system
        pass_filenames: false
        types_or: [python, pyi]
